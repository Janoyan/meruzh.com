<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wired Elements: Virtual Storage Sync</title>
    <script type="module" src="https://unpkg.com/wired-elements?module"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        :root { --wired-button-bg: #e0f2f1; }
        body {
            font-family: 'Architects Daughter', 'Segoe UI', cursive;
            display: flex;
            justify-content: center;
            padding: 50px;
            gap: 30px;
            background-color: #fdfdfd;
        }

        h2, h3, h4 { margin-top: 0; }

        .column {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 320px;
        }

        .product-card { text-align: center; padding: 20px; background: white; }
        .product-image { font-size: 4rem; margin: 20px 0; display: block; }
        .cart-container, .cookie-container { padding: 20px; background: white; min-height: 300px; }

        #cart-list { margin-top: 15px; }
        .cart-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px dashed #ccc;
            font-size: 0.9rem;
        }

        /* Virtual Cookie Box */
        .cookie-data {
            background: #2d2d2d;
            color: #a6e22e;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 0.75rem;
            word-break: break-all;
            border-radius: 4px;
            margin-top: 10px;
            min-height: 120px;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.2);
            white-space: pre-wrap;
        }

        .flying-particle {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            font-size: 2.5rem;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&display=swap" rel="stylesheet">
</head>
<body>

<div class="column">
    <wired-card elevation="3" class="product-card">
        <h3>Առցանց խանութ</h3>
        <span class="product-image" id="source-emoji">🎧</span>
        <h2>Ականջակալ</h2>
        <p>Անլար ականջակալ</p>
        <wired-button id="add-btn" elevation="3">Ավելացնել զամբյուղ</wired-button>
    </wired-card>
</div>

<div class="column">
    <wired-card elevation="2" class="cart-container">
        <h3>Իմ զամբյուղը</h3>
        <div id="cart-list"></div>
    </wired-card>
</div>

<div class="column">
    <wired-card elevation="4" class="cookie-container">
        <h3>Cookie հիշողություն</h3>
        <div class="cookie-data" id="cookie-display"></div>
        <div style="margin-top: 20px;">
            <wired-button id="clear-btn" style="--wired-button-bg: #ffebee;">Մաքրել հիշողությունը</wired-button>
        </div>
    </wired-card>
</div>

<script>
    // --- VIRTUAL STORAGE (No real cookies) ---
    let virtualCart = [];

    const addBtn = document.getElementById('add-btn');
    const cartList = document.getElementById('cart-list');
    const cookieDisplay = document.getElementById('cookie-display');
    const clearBtn = document.getElementById('clear-btn');
    const sourceEmoji = document.getElementById('source-emoji');

    window.onload = () => refreshUI();

    addBtn.addEventListener('click', (e) => {
        const newItem = {
            id: Date.now().toString().slice(-4),
            item: "Ականջակալ",
            price: "15,000֏"
        };
        runArcAnimation(e, newItem);
    });

    function runArcAnimation(e, itemData) {
        const flyer = document.createElement('div');
        flyer.className = 'flying-particle';
        flyer.textContent = '🎧';
        document.body.appendChild(flyer);

        // Get coordinates of the source (emoji) and target (cart)
        const startRect = sourceEmoji.getBoundingClientRect();
        const targetRect = cartList.getBoundingClientRect();

        gsap.fromTo(flyer,
            {
                x: startRect.left,
                y: startRect.top,
                opacity: 1,
                scale: 1
            },
            {
                duration: 0.8,
                x: targetRect.left + 20,
                y: targetRect.top + 20,
                scale: 0.5,
                rotation: 360,
                ease: "power2.out",
                onComplete: () => {
                    flyer.remove();
                    virtualCart.push(itemData);
                    refreshUI(true);
                }
            }
        );
    }

    function refreshUI(animateLast = false) {
        // 1. Update the "Cookie" display box (Virtual String)
        const virtualCookieString = virtualCart.map((item) => `${item.item}-${item.id}`).join('\n');
        cookieDisplay.textContent = virtualCart.length > 0 ? virtualCookieString : "";

        // Visual feedback for memory update
        gsap.fromTo(cookieDisplay, {color: "#fff"}, {color: "#a6e22e", duration: 0.4});

        // 2. Update Cart List
        if (virtualCart.length === 0) {
            cartList.innerHTML = `<p style="color: #888;">Ձեր զամբյուղը դատարկ է...</p>`;
        } else {
            cartList.innerHTML = '';
            virtualCart.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'cart-item';
                div.innerHTML = `<span>${item.item} (#${item.id})</span> <span>${item.price}</span>`;
                cartList.appendChild(div);

                if (animateLast && index === virtualCart.length - 1) {
                    gsap.from(div, { x: 30, opacity: 0, duration: 0.3 });
                }
            });
        }
    }

    clearBtn.addEventListener('click', () => {
        gsap.to(".cart-item", {
            x: -50,
            opacity: 0,
            stagger: 0.05,
            onComplete: () => {
                virtualCart = [];
                refreshUI();
            }
        });
    });
</script>
</body>
</html>
